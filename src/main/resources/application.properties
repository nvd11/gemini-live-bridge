# =============================================================================
# Gemini Live Bridge - 容器镜像内部基础配置 (application.properties)
# -----------------------------------------------------------------------------
# 优先级说明 (覆盖链从低到高):
#   4. K3s ConfigMap / Secret (POSIX 全大写下划线,  优先级 300 - 生产权威)
#   3. 本地 .env 文件 (位于项目根目录，被 git 忽略, 优先级 290)
#   2. 本文件 application.properties (打入镜像内,    优先级 250)
#   1. @WithDefault 代码级保底默认值               (优先级 100)
#
# 注：业务配置的保底值均在 asia.jppwl.bridge.config.BridgeConfig 接口上声明，
# 本文件仅承载所有环境共享的通用 Quarkus 运行时基线参数。
# =============================================================================

quarkus.application.name=gemini-live-bridge
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.log.level=INFO

# 容器内关闭 Banner 输出，保持 k3s 日志采集纯净
quarkus.banner.enabled=false
