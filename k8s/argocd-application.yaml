apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gemini-live-bridge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/nvd11/gemini-live-bridge.git'
    path: k8s
    targetRevision: main
  destination:
    # 🎯 部署在 OCI ARM 所在的集群 (例如 tencent-dp1-cluster 或 in-cluster)
    name: 'tencent-dp1-cluster'
    namespace: gemini-bridge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  # ---------------------------------------------------------------------------
  # GitOps 红线：真实机密只存在于集群 etcd（kubectl patch 注入），Git 中仅为
  # 占位符。必须忽略 Secret 的 /data 字段漂移，否则 ArgoCD 自动同步会把真实
  # 凭据回滚为占位符，导致生产服务熔断。
  # ---------------------------------------------------------------------------
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: gemini-live-bridge-secrets
      jsonPointers:
        - /data
