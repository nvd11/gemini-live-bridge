# =============================================================================
# Gemini Live Bridge - Secret (sensitive credentials)
#
# ⚠️ RED LINE: real values NEVER enter Git.
#   This manifest only carries placeholders. After ArgoCD creates the Secret,
#   patch the real credentials straight into the cluster etcd:
#
#     kubectl -n gemini-bridge patch secret gemini-live-bridge-secrets --type merge \
#       -p '{"stringData":{"BRIDGE_GEMINI_API_KEY":"<real-key>"}}'
#     kubectl -n gemini-bridge rollout restart deploy/gemini-live-bridge
#
#   ArgoCD is configured with ignoreDifferences on /data for this Secret
#   (see k8s/argocd-application.yaml), so GitOps syncs will NOT revert the
#   patched real values.
#
# Naming contract: POSIX UPPER_UNDERSCORE -> BridgeConfig @ConfigMapping
#     BRIDGE_GEMINI_API_KEY -> bridge.gemini.api-key -> gemini().apiKey()
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: gemini-live-bridge-secrets
  namespace: gemini-bridge
  labels:
    app: gemini-live-bridge
type: Opaque
stringData:
  # [Required] Google Gemini 3.8 Live API key
  BRIDGE_GEMINI_API_KEY: "REPLACE_ME_PATCH_VIA_KUBECTL"

  # [Required] JWT signing key for ephemeral session tokens (openssl rand -hex 32)
  BRIDGE_SESSION_SECRET_KEY: "REPLACE_ME_PATCH_VIA_KUBECTL"

  # [Optional] Feishu credentials — delete the keys entirely if Slack-only
  BRIDGE_FEISHU_APP_SECRET: "REPLACE_ME_PATCH_VIA_KUBECTL"
  BRIDGE_FEISHU_VERIFICATION_TOKEN: "REPLACE_ME_PATCH_VIA_KUBECTL"
  # BRIDGE_FEISHU_ENCRYPT_KEY: "REPLACE_ME_PATCH_VIA_KUBECTL"

  # [Optional] Slack credentials — delete the keys entirely if Feishu-only
  BRIDGE_SLACK_BOT_TOKEN: "REPLACE_ME_PATCH_VIA_KUBECTL"
  BRIDGE_SLACK_SIGNING_SECRET: "REPLACE_ME_PATCH_VIA_KUBECTL"
